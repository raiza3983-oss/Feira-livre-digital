name: Build Android APK & AAB (Capacitor)

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite iniciar a compilação manualmente no painel Actions do GitHub

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código-fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências do projeto
        run: npm install

      - name: Compilar aplicativo React (Web HTML/JS/CSS)
        run: npm run build

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Inicializar e Sincronizar Plataforma Android (Capacitor)
        run: |
          # Verifica se a pasta android já existe. Caso não, adiciona a plataforma.
          if [ ! -d "android" ]; then
            echo "Adicionando plataforma Android ao Capacitor..."
            npx cap add android
          else
            echo "A plataforma Android já existe. Sincronizando arquivos..."
          fi
          
          # Copia o arquivo google-services.json do root para a pasta android/app
          if [ -f "google-services.json" ]; then
            echo "Copiando google-services.json para android/app/..."
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
          else
            echo "AVISO: google-services.json não encontrado na raiz do projeto!"
          fi
          
          npx cap sync

      - name: Compilar APK & AAB com Gradle
        run: |
          cd android
          chmod +x gradlew
          
          echo "=========================================================="
          echo "OBTENDO CHAVES SHA-1 E SHA-256 DE DEBUG PARA O FIREBASE..."
          echo "=========================================================="
          ./gradlew signingReport
          
          echo "Compilando APK de Debug (para testar diretamente no celular)..."
          ./gradlew assembleDebug
          
          echo "Compilando AAB de Produção (para publicar na Google Play Store)..."
          ./gradlew bundleRelease

      - name: Upload do APK de Debug (Instale diretamente no celular)
        uses: actions/upload-artifact@v4
        with:
          name: APK-De-Teste-Instalavel
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload do AAB de Produção (Pronto para a Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: AAB-De-Producao-GooglePlay
          path: android/app/build/outputs/bundle/release/app-release-unsigned.aab
          retention-days: 7
